stages:          # List of stages for jobs, and their order of execution
  - deploy

run-ansible:
  stage: deploy
  tags:
    - srvansible
  script:
    - apt update && apt install -y openssh-client ansible python3-psycopg
    - sed -i '$a\' ${ansible_rgd_linux}
    - chmod go-rwx ${ansible_rgd_linux}
   # - echo "$ANSIBLE_VAULT_PASSWORD" > .vault_pass
    - ansible-playbook -i hosts.yml playbook.yml --private-key="${ansible_rgd_linux}" #--vault-password-file .vault_pass
  # after_script:
  #   - rm -f .vault_pass
- name: Create Docker GPG key directory
  ansible.builtin.file:
    path: /var/local/postgres
    owner: "999"
    group: "999"
    state: directory
    mode: "0755"

- name: Download wal-g binary
  ansible.builtin.get_url:
    url: https://github.com/wal-g/wal-g/releases/download/v3.0.8/wal-g-pg-24.04-amd64
    dest: /usr/local/bin/wal-g
    owner: root
    group: root
    mode: '0755'
    checksum: sha256:342574292b1907af738d48ff2d1d771ad90a63e441b40a85208022144253f6b8

- name: Launch full backup every night
  ansible.builtin.cron:
    name: "full backup"
    minute: "0"
    hour: "2"
    job: "docker exec -u postgres postgres-app1-1 backup-push.sh"

- name: S'assurer que les conteneurs Docker sont bien démarrés
  ansible.builtin.command: docker compose up -d
  args:
    chdir: /opt/postgres/
  changed_when: false

- name: Configure postgres cluster 
  ansible.builtin.include_tasks: configure_cluster.yml
  loop: "{{ clusters | dict2items }}"
  loop_control:
    loop_var: cluster_item
    index_var: cluster_index
    label: "{{ cluster_item.key }}"

- name: Déployer le script de restauration interactif
  ansible.builtin.copy:
    src: restoration.sh
    dest: /opt/postgres/restoration.sh
    mode: '0755'